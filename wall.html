<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>感謝牆</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: projector wall. A fixed manuscript-paper column on the left (vertical title, QR, counts, mission filter); submissions flow as cards in columns on the right, newest first. */
:root{
  --paper:#F3F7F6; --card:#FFFFFF; --ink:#1D2220; --muted:#5B6166;
  --grid:#43AE74; --grid-soft:#D3EBDD; --wash:rgba(246,250,249,.78);
  --f-serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-sans);overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(var(--wash),var(--wash)),url(paper.jpg) center/cover no-repeat,var(--paper)}
.app{display:grid;grid-template-columns:clamp(260px,22vw,340px) 1fr;height:100%}
aside{border-right:2px solid var(--grid);background:rgba(255,255,255,.72);padding:28px 24px;display:flex;flex-direction:column;gap:22px;min-height:0;overflow:auto}
.titlebox{display:flex;justify-content:space-between;gap:10px}
h1{margin:0;font-family:var(--f-serif);font-weight:700;font-size:clamp(1.6rem,2.3vw,2.4rem);--vt-gap:.3em}
.meta{font-family:var(--f-serif);font-size:.95rem;align-self:flex-end;--vt-gap:.45em}

/* hand-stacked vertical text: one character per line, columns right to left */
.vt{display:flex;flex-direction:row-reverse;gap:var(--vt-gap,.35em);writing-mode:horizontal-tb}
.vt .col{display:flex;flex-direction:column;align-items:center;line-height:1.18}
.vt .col span{display:block;width:1em;text-align:center}
.vt .col span.p{height:.55em;line-height:.3;transform:translateX(.38em)}
.qr{background:#fff;border:1.5px solid var(--grid);padding:12px;display:flex;flex-direction:column;align-items:center;gap:8px}
#qrcode{width:100%;aspect-ratio:1;max-width:220px;display:flex;align-items:center;justify-content:center}
#qrcode svg{width:100%;height:auto;display:block}
.qr p{margin:0;font-size:.85rem;text-align:center;word-break:break-all;color:var(--muted)}
.count{display:flex;align-items:baseline;gap:8px;font-family:var(--f-serif)}
.count b{font-size:3rem;line-height:1;color:var(--grid);font-variant-numeric:tabular-nums}
.tabs{display:flex;flex-direction:column;gap:6px}
.tabs button{appearance:none;border:1.5px solid var(--grid-soft);background:#fff;color:var(--ink);font:500 .95rem var(--f-sans);padding:8px 12px;display:flex;justify-content:space-between;gap:8px;cursor:pointer;text-align:left}
.tabs button[aria-pressed="true"]{border-color:var(--grid);background:var(--grid);color:#fff;font-weight:700}
.tabs span.n{font-variant-numeric:tabular-nums}
.host{background:#fff;border:1.5px solid var(--grid);padding:12px;display:flex;flex-direction:column;gap:8px}
.host .lbl{font-size:.8rem;color:var(--muted)}
.hostrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hostrow button,.keybox button{appearance:none;border:1.5px solid var(--grid);background:#fff;color:var(--ink);font:700 .95rem var(--f-sans);padding:10px 8px;cursor:pointer}
.hostrow button#next{background:var(--grid);color:#fff}
.hostrow button:disabled{opacity:.35;cursor:default}
.host button:focus-visible,.host input:focus-visible{outline:3px solid var(--grid);outline-offset:2px}
.hostnote{margin:0;font-size:.75rem;color:var(--muted)}
.hostmsg{margin:0;font-size:.8rem;color:#B4442F}
.keybox{display:grid;grid-template-columns:1fr auto;gap:6px}
.keybox input{font:1rem var(--f-sans);padding:8px;border:1.5px solid var(--grid-soft);min-width:0}
.allbox{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted)}
.banner{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:start;background:rgba(255,255,255,.88);border:1.5px solid var(--grid);padding:20px 24px;margin-bottom:24px}
.bn-no{font-family:var(--f-serif);font-weight:900;color:var(--grid);font-size:clamp(1.8rem,2.6vw,2.6rem);line-height:1.1;display:flex;flex-direction:column;align-items:center}
.bn-title{margin:0;font-family:var(--f-serif);font-weight:700;font-size:clamp(1.4rem,2vw,2rem)}
.bn-q{margin:4px 0 0;font-size:clamp(1.1rem,1.5vw,1.5rem)}
.bn-phase{display:inline-flex;align-items:center;gap:10px;margin:0 0 6px;font-size:clamp(.9rem,1.1vw,1.1rem);font-weight:700;color:#fff;background:var(--ink);padding:4px 12px}
.bn-phase.thx{background:var(--grid)}
.bn-timer{font-family:var(--f-serif);font-size:clamp(2.4rem,4vw,4rem);font-weight:900;color:var(--grid);line-height:1;font-variant-numeric:tabular-nums;justify-self:end;align-self:center}
.bn-timer.over{color:#B4442F;font-size:clamp(1.4rem,2vw,2rem)}
.banner.timed{grid-template-columns:auto 1fr auto}
.card .rank{position:absolute;top:10px;left:10px;background:var(--ink);color:#fff;font-family:var(--f-serif);font-weight:900;font-size:1.1rem;padding:4px 12px;z-index:1}
.card.r1 .rank{background:#C9A227}.card.r2 .rank{background:#8E9AA3}.card.r3 .rank{background:#A8714A}
.card{position:relative}
.card .rank.inline{position:static;font-size:.95rem;padding:2px 10px;flex:none}
.card .top .who{flex:1;min-width:0}
.card .who .by{display:block;font-family:var(--f-sans);font-weight:500;font-size:.75rem;color:var(--muted)}
.card .el{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.grid.race{columns:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px;align-items:start}
.grid.race .card{margin:0}
.bn-to{margin:10px 0 0;font-size:clamp(.95rem,1.2vw,1.2rem);color:var(--grid);font-weight:700}
.roster{background:#fff;border:1.5px solid var(--grid);display:flex;flex-direction:column;min-height:180px;flex:1 1 auto}
.rsum{display:flex;flex-direction:column;gap:2px;padding:8px 12px;border-bottom:1.5px solid var(--grid-soft);font-size:.8rem;color:var(--muted)}
.rsum b{color:var(--ink);font-variant-numeric:tabular-nums}
.rgrid{display:grid;grid-template-columns:1fr 3.2em 3.2em;align-items:center}
.rhead{padding:6px 12px;font-size:.75rem;color:var(--muted);font-weight:700;border-bottom:1px solid var(--grid-soft)}
.rhead span:not(:first-child),.rrow span:not(:first-child){text-align:center}
.rlist{list-style:none;margin:0;padding:0;overflow:auto;flex:1 1 0;min-height:0}
.rrow{padding:5px 12px;font-size:.9rem;border-bottom:1px dashed var(--grid-soft)}
.rrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .y{color:var(--grid);font-weight:900}
.rrow .n{color:#C5CCC9}
.rrow .p{color:var(--ink);font-size:.8rem;font-variant-numeric:tabular-nums}
.rrow.full{background:#F2FAF5}
.rempty{padding:10px 12px;font-size:.8rem;color:var(--muted)}
body.started .titlebox{display:none}
body.started #qrcode{max-width:130px}
body.started .qr{flex-direction:row;justify-content:center}
body.started .qr p{text-align:left}
aside{gap:16px}
.boardview{display:flex;flex-direction:column;gap:28px}
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px;align-items:end;max-width:1100px;margin:0 auto;width:100%}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.pod .medal{font-family:var(--f-serif);font-weight:900;font-size:1.2rem;color:#fff;padding:4px 16px;background:var(--ink)}
.pod.p1 .medal{background:#C9A227}.pod.p2 .medal{background:#8E9AA3}.pod.p3 .medal{background:#A8714A}
.pod .pname{font-family:var(--f-serif);font-weight:900;font-size:clamp(1.6rem,2.6vw,2.8rem);line-height:1.2;min-height:1.2em;overflow-wrap:anywhere}
.pod.p1 .pname{font-size:clamp(2rem,3.4vw,3.6rem)}
.pod .ppts{font-size:clamp(1.1rem,1.6vw,1.6rem);font-weight:700;color:var(--grid);min-height:1.4em;font-variant-numeric:tabular-nums}
.pod .pmem{font-size:.95rem;color:var(--muted);min-height:1.5em}
.pod .block{width:100%;background:#fff;border:1.5px solid var(--grid);border-bottom:0}
.pod.p1 .block{height:220px;background:var(--grid-soft)}.pod.p2 .block{height:150px}.pod.p3 .block{height:100px}
.pod:not(.shown) .pname{color:#C5CCC9}
.pod.shown .pname,.pod.shown .ppts{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.6) translateY(16px)}to{opacity:1;transform:none}}
.restwrap{max-width:720px;margin:0 auto;width:100%;background:rgba(255,255,255,.88);border:1.5px solid var(--grid);padding:12px 18px}
.restt{margin:0 0 6px;font-size:.85rem;color:var(--muted);font-weight:700}
.rest{list-style:none;margin:0;padding:0;columns:2;column-gap:28px}
.rest li{display:grid;grid-template-columns:2.2em 1fr auto;gap:8px;padding:5px 0;border-bottom:1px dashed var(--grid-soft);break-inside:avoid;font-size:1.05rem}
.rest .rk{font-family:var(--f-serif);font-weight:900;color:var(--muted);font-variant-numeric:tabular-nums}
.rest .rp{font-variant-numeric:tabular-nums;color:var(--grid);font-weight:700}
@media (prefers-reduced-motion:reduce){.pod.shown .pname,.pod.shown .ppts{animation:none}}
.viewsel{display:flex;flex-direction:column;gap:4px}
.vs{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--grid)}
.vs button{appearance:none;border:0;background:#fff;color:var(--ink);font:500 .8rem var(--f-sans);padding:7px 2px;cursor:pointer}
.vs button + button{border-left:1px solid var(--grid-soft)}
.vs button[aria-pressed="true"]{background:var(--grid);color:#fff;font-weight:700}
.vs button:focus-visible{outline:3px solid var(--grid);outline-offset:2px}
main{position:relative}
body.has-ticker main{padding-bottom:96px}
.ticker{position:fixed;left:clamp(260px,22vw,340px);right:0;bottom:0;height:72px;background:var(--ink);color:#fff;overflow:hidden;display:flex;align-items:center;z-index:5;border-top:3px solid var(--grid)}
.track{display:flex;white-space:nowrap;animation:marquee var(--dur,40s) linear infinite;will-change:transform;font-size:1.35rem;padding-left:24px}
.run{display:flex;flex:none}
.tk{display:inline-flex;align-items:baseline;gap:8px;margin-right:56px;font-family:var(--f-serif)}
.tk b{color:#9FE0BA;font-family:var(--f-sans);font-size:1rem;font-weight:700}
.tk small{font-family:var(--f-sans);font-size:.95rem;color:#C9D2CE}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.track{animation:none;flex-wrap:wrap;white-space:normal}.run[aria-hidden]{display:none}}
@media (max-width:760px){.ticker{left:0}}
.status{font-size:.8rem;color:var(--muted);margin-top:auto}
main{overflow:auto;padding:28px;min-width:0}
.grid{columns:300px;column-gap:20px}
.card{break-inside:avoid;margin:0 0 20px;background:var(--card);border:1.5px solid var(--grid);display:flex;flex-direction:column;animation:in .5s ease both}
.card .ph{background:var(--grid-soft);aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.85rem}
.card img{display:block;width:100%;height:auto}
.card .tx{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px}
.card .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card .who{font-family:var(--f-serif);font-weight:700;font-size:1.2rem}
.card .tag{font-size:.75rem;color:var(--grid);border:1px solid var(--grid);padding:1px 8px;white-space:nowrap}
.card .ans{margin:0;font-size:1.1rem;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.card .thx{margin:4px 0 2px;padding:10px 12px;background:var(--paper);border-left:3px solid var(--grid);display:flex;flex-direction:column;gap:4px}
.card .thx .to{font-size:.8rem;color:var(--grid);font-weight:700}
.card .thx p{margin:0;font-family:var(--f-serif);font-size:1.25rem;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.card .thx + .ans{font-size:.9rem;color:var(--muted)}
.empty{max-width:28rem;margin:12vh auto 0;text-align:center;font-family:var(--f-serif);font-size:1.3rem;line-height:1.8}
.empty small{display:block;font-family:var(--f-sans);font-size:.95rem;color:var(--muted)}
@keyframes in{from{opacity:.2;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}
@media (max-width:760px){body{overflow:auto}.app{grid-template-columns:1fr;height:auto}aside{border-right:0;border-bottom:2px solid var(--grid)}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="titlebox">
      <div class="meta" data-vt="嘉南中學聯合聚會|貳零貳陸．壹壹壹貳"></div>
      <h1 data-vt="因為，|需要感謝的人太多了"></h1>
    </div>
    <div class="qr">
      <div id="qrcode" aria-label="任務頁 QR code"></div>
      <p>掃描加入街景任務<br><span id="qrurl"></span></p>
    </div>
    <div class="count"><b id="total">0</b><span id="countLabel">則感謝已送達</span></div>
    <div class="host" aria-label="主持人控制">
      <span class="lbl" id="curLabel">目前：尚未開始</span>
      <div class="hostrow">
        <button type="button" id="prev">◀ 上一步</button>
        <button type="button" id="next">開始第壹題 ▶</button>
      </div>
      <p class="hostnote">每題兩步：搶答 → 寫謝謝。也可以用鍵盤 ← → 或簡報筆翻頁</p>
      <div class="keybox" id="keybox" hidden>
        <input id="hostkey" type="password" placeholder="輸入主持密碼" aria-label="主持密碼">
        <button type="button" id="savekey">確定</button>
      </div>
      <p class="hostmsg" id="hostmsg" hidden></p>
      <div class="viewsel" role="group" aria-label="大螢幕顯示">
        <span class="lbl">大螢幕顯示</span>
        <div class="vs" id="viewSel">
          <button type="button" data-v="current" aria-pressed="true">目前進度</button>
          <button type="button" data-v="thanks" aria-pressed="false">所有感謝</button>
          <button type="button" data-v="all" aria-pressed="false">所有投稿</button>
        </div>
      </div>
    </div>
    <section class="roster" id="rosterBox" aria-label="這一題各隊進度">
      <div class="rsum"><span id="rTitle">這一題進度</span><span>答題 <b id="rA">0</b> 隊．感謝 <b id="rT">0</b> 人．共 <b id="rN">0</b> 隊</span></div>
      <div class="rgrid rhead"><span>隊伍</span><span>答題</span><span>感謝</span></div>
      <ol class="rlist" id="roster"></ol>
    </section>
    <div class="status" id="status">連線中…</div>
  </aside>
  <main>
    <section class="banner" id="banner" aria-live="polite">
      <div class="bn-no" id="bnNo" aria-hidden="true"></div>
      <div><p class="bn-phase" id="bnPhase" hidden></p><p class="bn-title" id="bnTitle"></p><p class="bn-q" id="bnQ"></p><p class="bn-to" id="bnTo"></p></div>
      <div class="bn-timer" id="bnTimer" hidden></div>
    </section>
    <div class="empty" id="empty">這一題還沒有人送出<small>打開街景開始找吧</small></div>
    <div class="grid" id="grid"></div>
    <div class="ticker" id="ticker" hidden aria-label="大家寫的感謝的話"><div class="track" id="track"></div></div>
    <section class="boardview" id="boardView" hidden aria-live="polite">
      <div class="podium" id="podium"></div>
      <div id="restWrap" class="restwrap"><p class="restt">第四名以後</p><ol class="rest" id="rest"></ol></div>
    </section>
  </main>
</div>

<script>
/* 直排文字：data-vt 用「|」分欄，每個字一行 */
document.querySelectorAll("[data-vt]").forEach(function(el){
  el.classList.add("vt");
  el.setAttribute("aria-label", el.getAttribute("data-vt").replace(/\|/g,""));
  el.getAttribute("data-vt").split("|").forEach(function(t){
    var col=document.createElement("span"); col.className="col"; col.setAttribute("aria-hidden","true");
    Array.from(t).forEach(function(ch){ var s=document.createElement("span"); s.textContent=ch; if("，、。".indexOf(ch)>-1) s.className="p"; col.appendChild(s); });
    el.appendChild(col);
  });
});
</script>
<script src="qrcode.js"></script>
<script src="config.js"></script>
<script>
(function(){
const URL_ = (window.SCRIPT_URL || "").trim();
const MS = Array.isArray(window.MISSIONS) ? window.MISSIONS : [];
const NUM = ["壹","貳","參","肆","伍","陸","柒","捌","玖","拾"];
const $ = id => document.getElementById(id);
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const studentURL = window.STUDENT_URL || location.href.replace(/wall\.html.*$/,"").replace(/[?#].*$/,"");
$("qrurl").textContent = studentURL.replace(/^https?:\/\//,"");
try{ const q=qrcode(0,"M"); q.addData(studentURL); q.make();
  $("qrcode").innerHTML = q.createSvgTag({cellSize:8,margin:0,scalable:true}); }
catch(e){ $("qrcode").textContent = "QR code 載入失敗"; }

const THX_SEC = Number(window.THANKS_SECONDS) || 60;
let items = [], current = 0, phase = "find", phaseAt = 0, clockOffset = 0, view = "current", pending = false;
const imgCache = {}, cards = {};
const LABELS = (()=>{ let k=0; return MS.map(m=> m.practice ? "試玩題" : "第"+(NUM[k++]||k)+"題"); })();
const numText = n => LABELS[n-1] || ("第"+n+"題");
let scored = [], teams = [], teamsSig = "";   // 有正確答案、要排名的題目代號（從 Code.gs 來）
const fmt = sec => Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0");
/* 步驟：0 尚未開始；第 n 題搶答 = 2n-1；第 n 題寫謝謝 = 2n */
const stepOf = (c,p) => c <= 0 ? 0 : (p === "thanks" ? 2*c : 2*c-1);
const stateOf = st => st <= 0 ? {current:0, phase:"find"} : {current:Math.ceil(st/2), phase: st % 2 ? "find" : "thanks"};
const BOARD = MS.length + 1;            // 題目全部結束後的「排行榜」
const MAXSTEP = 2*MS.length + 1;
const POINTS = Array.isArray(window.POINTS) ? window.POINTS : [5,4,3];
const CORRECT_POINTS = Number(window.CORRECT_POINTS ?? 2);
let reveal = 0;                          // 排行榜揭曉到第幾名（0 = 還沒揭曉，3 = 第一名也揭曉了）

function makeCard(it, rank, elapsed){
  const c = document.createElement("article"); c.className = "card" + (rank && rank <= 3 ? " r"+rank : "");
  const hasImg = it.img && it.type !== "thanks";
  const rk = rank ? Object.assign(document.createElement("span"),{className: hasImg ? "rank" : "rank inline", textContent: "第 "+rank+" 名"}) : null;
  if(rk && hasImg) c.appendChild(rk);
  if(hasImg){
    const ph = document.createElement("div"); ph.className="ph"; ph.textContent="截圖載入中…"; c.appendChild(ph);
    loadImg(it.img).then(src=>{ if(!src){ph.textContent="截圖讀取失敗";return;} const im=new Image(); im.alt=(it.name||"")+" 的街景截圖"; im.src=src; ph.replaceWith(im); });
  }
  const tx = document.createElement("div"); tx.className="tx";
  const top = document.createElement("div"); top.className="top";
  const w = document.createElement("span"); w.className="who";
  if(it.type === "thanks"){ w.textContent = it.name || "無名小卒"; if(it.team){ const tg=document.createElement("small"); tg.className="by"; tg.textContent=it.team; w.append(" ", tg); } }
  else { w.textContent = it.team || it.name || "無名小隊"; if(it.team && it.name){ const by=document.createElement("small"); by.className="by"; by.textContent=it.name+" 答"; w.append(" ", by); } }
  const mi = Number(it.mission)-1;
  const t = document.createElement("span"); t.className="tag";
  if(elapsed != null){ t.className = "el"; t.textContent = "用時 " + fmt(elapsed); }
  else t.textContent = numText(mi+1)+(MS[mi]&&MS[mi].title?"．"+MS[mi].title:"");
  if(rk && !hasImg) top.append(rk);
  top.append(w,t); tx.appendChild(top);
  if(it.type === "thanks" && it.thanks){
    const q=document.createElement("blockquote"); q.className="thx";
    const to=document.createElement("span"); to.className="to"; to.textContent="給 "+(it.thanksTo||(MS[mi]&&MS[mi].thanksTo)||"你");
    const p=document.createElement("p"); p.textContent=it.thanks;
    q.append(to,p); tx.appendChild(q);
  }
  if(it.type !== "thanks" && it.answer){ const a=document.createElement("p"); a.className="ans"; a.textContent=it.answer; tx.appendChild(a); }
  c.appendChild(tx);
  return c;
}

function renderBanner(){
  const no = $("bnNo"); no.replaceChildren();
  const ph = $("bnPhase"), tm = $("bnTimer");
  if(current >= BOARD){
    $("bnTitle").textContent = "各隊總排名";
    $("bnQ").textContent = "每題答對：第 1 名 " + POINTS[0] + " 分、第 2 名 " + POINTS[1] + " 分、第 3 名 " + POINTS[2] + " 分，其他答對 " + CORRECT_POINTS + " 分。";
    $("bnTo").textContent = ""; ph.hidden = false; ph.textContent = "排行榜"; ph.classList.add("thx"); tm.hidden = true;
    $("curLabel").textContent = "目前：排行榜（已揭曉 " + reveal + " / 3）";
  }else if(current === 0){
    $("bnTitle").textContent = "準備開始";
    $("bnQ").textContent = "掃左邊的 QR code，先填好名字，等主持人開始第壹題。";
    $("bnTo").textContent = ""; ph.hidden = true; tm.hidden = true;
    $("curLabel").textContent = "目前：尚未開始";
  }else{
    const m = MS[current-1] || {};
    Array.from(numText(current)).forEach(ch=>{ const s=document.createElement("span"); s.textContent=ch; no.appendChild(s); });
    $("bnTitle").textContent = m.title || "";
    ph.hidden = false;
    if(phase === "find"){
      ph.textContent = "搶答中．找到就送出"; ph.classList.remove("thx");
      $("bnQ").textContent = m.question || ""; $("bnTo").textContent = ""; tm.hidden = true;
    }else{
      ph.textContent = "寫一句謝謝"; ph.classList.add("thx");
      $("bnQ").textContent = m.thanksLead || "";
      $("bnTo").textContent = m.thanksTo ? "寫一句謝謝給：" + m.thanksTo : "";
      tm.hidden = false;
    }
    $("curLabel").textContent = "目前：" + numText(current) + (phase==="find"?"．搶答":"．寫謝謝") + "（共 " + MS.filter(m=>!m.practice).length + " 題" + (MS.some(m=>m.practice)?"＋試玩":"") + "）";
  }
  $("banner").classList.toggle("timed", !tm.hidden);
  const st = stepOf(current, phase);
  $("prev").disabled = st <= 0;
  $("next").disabled = st >= MAXSTEP && reveal >= 3;
  if(current >= BOARD){ $("next").textContent = reveal >= 3 ? "全部結束" : "揭曉第" + ["三","二","一"][reveal] + "名 ▶"; return; }
  if(st === MAXSTEP - 1){ $("next").textContent = "公布排行榜 ▶"; return; }
  const nx = stateOf(st+1);
  $("next").textContent = st >= MAXSTEP ? "全部結束" : (nx.phase === "thanks" ? "結束搶答，寫謝謝 ▶" : (st === 0 ? "開始" : "下一題：") + numText(nx.current) + " ▶");
  tick();
}
function tick(){
  const tm = $("bnTimer");
  if(current < 1 || phase !== "thanks") return;
  const left = Math.max(0, Math.round(THX_SEC - (Date.now() + clockOffset - phaseAt)/1000));
  tm.textContent = left > 0 ? fmt(left) : "時間到";
  tm.classList.toggle("over", left === 0);
}
setInterval(tick, 1000);

function renderRoster(){
  const ol = $("roster"); ol.replaceChildren();
  /* 隊伍：先用後端的隊伍名單，再補上有投稿但不在名單裡的 */
  const tmap = {}, order = [];
  teams.forEach(t=>{ tmap[t.code] = {code:t.code, team:t.team, members:t.members||[]}; order.push(t.code); });
  items.forEach(it=>{ const k = it.code || ("名:"+(it.name||"")); if(!tmap[k]){ tmap[k] = {code:k, team: it.team || it.name || "?", members:[]}; order.push(k); } });
  const m = MS[current-1] || {}, isScored = scored.includes(m.id);
  let nA = 0, nT = 0, nP = 0;
  const rows = order.map(k=>{
    const t = tmap[k];
    const mine = items.filter(it=>(it.code || ("名:"+(it.name||""))) === k && Number(it.mission)===current);
    const a = mine.some(it=>it.type!=="thanks" && (!isScored || it.correct==="O"));
    const thx = new Set(mine.filter(it=>it.type==="thanks").map(it=>(it.name||"").trim()));
    const size = Math.max(t.members.length, thx.size);
    if(a) nA++; nT += thx.size; nP += size;
    return {name:t.team, a, t:thx.size, size, members:t.members};
  });
  rows.sort((x,y)=>((x.a?1:0)+(x.t>=x.size&&x.size?1:0))-((y.a?1:0)+(y.t>=y.size&&y.size?1:0)));
  rows.forEach(r=>{
    const full = r.a && r.size && r.t >= r.size;
    const li = document.createElement("li"); li.className = "rgrid rrow" + (full ? " full" : "");
    const n = document.createElement("span"); n.className="nm"; n.textContent = r.name; n.title = r.members.join("、");
    const a = document.createElement("span"); a.className = r.a?"y":"n"; a.textContent = r.a?"✓":"—"; a.setAttribute("aria-label", r.a?"已答題":"未答題");
    const t = document.createElement("span"); t.className = full || (r.size && r.t>=r.size) ? "y" : (r.t ? "p" : "n");
    t.textContent = r.size ? (r.t >= r.size ? "✓" : r.t + "/" + r.size) : (r.t ? r.t : "—");
    t.setAttribute("aria-label", "已送感謝 " + r.t + " 人，共 " + r.size + " 人");
    li.append(n,a,t); ol.appendChild(li);
  });
  if(!rows.length){ const li=document.createElement("li"); li.className="rempty"; li.textContent="還沒有隊伍"; ol.appendChild(li); }
  $("rTitle").textContent = current ? numText(current) + "各隊進度" + (isScored ? "．答對才打勾" : "") : "各隊進度";
  $("rA").textContent = nA; $("rT").textContent = nT + "/" + nP; $("rN").textContent = rows.length;
}

function computeBoard(){
  const tmap = {}, order = [];
  teams.forEach(t=>{ tmap[t.code] = {key:t.code, team:t.team, members:t.members||[], points:0, correct:0, firsts:0, rankSum:0, tsSum:0}; order.push(t.code); });
  const keyOf = it => it.code || ("名:"+(it.name||""));
  items.forEach(it=>{ const k = keyOf(it); if(!tmap[k]){ tmap[k] = {key:k, team:it.team||it.name||"?", members:[], points:0, correct:0, firsts:0, rankSum:0, tsSum:0}; order.push(k); } });
  MS.forEach((m,i)=>{
    if(m.practice || !scored.includes(m.id)) return;
    const seen = {};
    items.filter(it=>it.type!=="thanks" && Number(it.mission)===i+1 && it.correct==="O")
      .sort((a,b)=>(a.ts||0)-(b.ts||0))
      .forEach(it=>{
        const k = keyOf(it); if(seen[k]) return; seen[k] = 1;
        const r = Object.keys(seen).length, t = tmap[k];
        t.points += r <= POINTS.length ? POINTS[r-1] : CORRECT_POINTS;
        t.correct++; t.rankSum += r; t.tsSum += (it.ts||0); if(r === 1) t.firsts++;
      });
  });
  return order.map(k=>tmap[k]).sort((a,b)=> b.points-a.points || b.firsts-a.firsts || a.rankSum-b.rankSum || b.correct-a.correct || a.tsSum-b.tsSum);
}
function renderBoard(){
  const board = computeBoard();
  const pod = $("podium"); pod.replaceChildren();
  [1,0,2].forEach(idx=>{   /* 擺法：第二名｜第一名｜第三名 */
    const t = board[idx], place = idx+1;
    const shown = reveal >= 4 - place;        // 第三名先揭曉
    const d = document.createElement("div"); d.className = "pod p"+place + (shown ? " shown" : "");
    const medal = document.createElement("div"); medal.className = "medal"; medal.textContent = "第 " + ["一","二","三"][idx] + " 名";
    const nm = document.createElement("div"); nm.className = "pname";
    const pts = document.createElement("div"); pts.className = "ppts";
    const mem = document.createElement("div"); mem.className = "pmem";
    if(!t){ nm.textContent = "從缺"; }
    else if(shown){ nm.textContent = t.team; pts.textContent = t.points + " 分"; mem.textContent = (t.members.join("、") || "") + "．答對 " + t.correct + " 題"; }
    else { nm.textContent = "？"; }
    const block = document.createElement("div"); block.className = "block";
    d.append(medal, nm, pts, mem, block); pod.appendChild(d);
  });
  const rest = $("rest"); rest.replaceChildren();
  board.slice(3).forEach((t,i)=>{
    const li = document.createElement("li");
    const r = document.createElement("span"); r.className="rk"; r.textContent = (i+4);
    const n = document.createElement("span"); n.className="rn"; n.textContent = t.team;
    const p = document.createElement("span"); p.className="rp"; p.textContent = t.points + " 分";
    li.append(r,n,p); rest.appendChild(li);
  });
  $("restWrap").hidden = board.length <= 3;
}

/* 頒獎時底下跑馬燈：所有人的感謝的話 */
let tickerSig = "";
function renderTicker(){
  const on = current >= BOARD;
  $("ticker").hidden = !on;
  document.body.classList.toggle("has-ticker", on);
  if(!on) return;
  const th = items.filter(it=>it.type==="thanks" && it.thanks);
  const sig = th.map(it=>it.key).join(",");
  if(sig === tickerSig) return;
  tickerSig = sig;
  const track = $("track"); track.replaceChildren();
  if(!th.length){ track.textContent = "謝謝每一位今天一起迷路、一起找人的你。"; track.style.animation = "none"; return; }
  const makeRun = () => {
    const frag = document.createDocumentFragment();
    th.forEach(it=>{
      const mi = Number(it.mission)-1;
      const s = document.createElement("span"); s.className = "tk";
      const to = document.createElement("b"); to.textContent = "給 " + (it.thanksTo || (MS[mi]&&MS[mi].thanksTo) || "你") + "：";
      const tx = document.createTextNode("「" + it.thanks + "」");
      const by = document.createElement("small"); by.textContent = "— " + (it.name||"") + (it.team ? "（" + it.team + "）" : "");
      s.append(to, tx, by); frag.appendChild(s);
    });
    return frag;
  };
  const run1 = document.createElement("div"); run1.className = "run"; run1.appendChild(makeRun());
  const run2 = document.createElement("div"); run2.className = "run"; run2.setAttribute("aria-hidden","true"); run2.appendChild(makeRun());
  track.append(run1, run2);
  const chars = th.reduce((n,it)=>n + (it.thanks||"").length + 20, 0);
  track.style.animation = "";
  track.style.setProperty("--dur", Math.max(25, Math.round(chars * 0.28)) + "s");
}

function render(){
  renderBanner();
  renderTicker();
  const onBoard = current >= BOARD && view === "current";
  $("boardView").hidden = !onBoard; $("grid").hidden = onBoard; $("rosterBox").hidden = current >= BOARD;
  if(onBoard){ renderBoard(); $("empty").hidden = true; $("total").textContent = computeBoard().length; $("countLabel").textContent = "隊參加"; document.body.classList.add("started"); return; }
  if(current < BOARD) renderRoster();
  document.body.classList.toggle("started", current > 0);
  const grid = $("grid");
  let shown, label;
  if(view === "all"){
    shown = items.slice().reverse().map(it=>({it})); label = "則投稿（全部題目）";
  }else if(view === "thanks"){
    shown = items.filter(it=>it.type==="thanks").slice().reverse().map(it=>({it})); label = "則感謝（全部題目）";
  }else if(phase === "find"){
    const m = MS[current-1] || {}, isScored = scored.includes(m.id);
    const seen = {};
    const el = it => phaseAt && it.ts ? Math.max(0, Math.round((it.ts - phaseAt)/1000)) : null;
    let list = items.filter(it=>it.type!=="thanks" && Number(it.mission)===current).sort((a,b)=>(a.ts||0)-(b.ts||0));
    if(isScored){
      shown = list.filter(it=>it.correct==="O")
        .filter(it=>{ const k=(it.code||it.name||"").trim(); if(seen[k]) return false; seen[k]=1; return true; })
        .map((it,i)=>({it, rank:i+1, elapsed: el(it)}));
      label = "隊答對．這一題";
    }else{
      shown = list.slice().reverse().map(it=>({it, elapsed: el(it)}));
      label = "則投稿．這一題";
    }
  }else{
    shown = items.filter(it=>it.type==="thanks" && Number(it.mission)===current).slice().reverse().map(it=>({it}));
    label = "則感謝．這一題";
  }
  grid.classList.toggle("race", view === "current" && phase === "find");
  $("total").textContent = shown.length;
  $("countLabel").textContent = current === 0 && view === "current" ? "則感謝已送達" : label;
  $("empty").hidden = shown.length > 0 || (current === 0 && view === "current");
  $("empty").firstChild.textContent = view !== "current" ? "還沒有任何投稿" : phase === "find" ? (scored.includes((MS[current-1]||{}).id) ? "還沒有人答對" : "還沒有人送出") : "還沒有人送出感謝";
  grid.replaceChildren(...shown.map(x=>{
    const k = x.it.key + "|" + (x.rank||"") + "|" + (x.elapsed==null?"":x.elapsed);
    return cards[k] || (cards[k] = makeCard(x.it, x.rank, x.elapsed));
  }));
}

const queue = []; let busy = false;
function loadImg(id){
  if(id.startsWith("data:")) return Promise.resolve(id);
  if(imgCache[id]) return imgCache[id];
  imgCache[id] = new Promise(res=>{ queue.push({id,res}); pump(); });
  return imgCache[id];
}
async function pump(){
  if(busy) return; busy = true;
  while(queue.length){
    const {id,res} = queue.shift();
    try{ const r = await fetch(URL_+"?img="+encodeURIComponent(id)); const j = await r.json(); res(j.ok?j.data:null); }
    catch(e){ res(null); delete imgCache[id]; }
  }
  busy = false;
}

async function poll(){
  const st = $("status");
  try{
    let list, st0, teamsChanged = false;
    if(!URL_){
      list = store.get("thanks-demo",[]).map(x=>Object.assign({},x,{img:x.image||""}));
      st0 = store.get("thanks-state",{current:0,phase:"find",at:0});
      { const tm = store.get("thanks-teams",{}); const arr = Object.values(tm); const ts = JSON.stringify(arr); if(ts !== teamsSig){ teamsSig = ts; teams = arr; teamsChanged = true; } }
      st.textContent = "試玩模式：只顯示這台裝置送出的內容";
    }else{
      const r = await fetch(URL_+"?list=1&t="+Date.now()); const j = await r.json();
      if(!j.ok) throw new Error(j.error);
      list = j.items; st0 = {current:j.current, phase:j.phase, at:j.at};
      if(j.now) clockOffset = j.now - Date.now();
      if(Array.isArray(j.scored)) scored = j.scored;
      if(Array.isArray(j.teams)){ const ts = JSON.stringify(j.teams); if(ts !== teamsSig){ teamsSig = ts; teams = j.teams; teamsChanged = true; } }
      st.textContent = "已連線．"+new Date().toLocaleTimeString("zh-TW",{hour:"2-digit",minute:"2-digit",second:"2-digit"})+" 更新";
    }
    list.forEach(x=>{ x.key = x.id || ("n"+x.n); if(!x.type) x.type = (x.thanks && !x.answer && !x.img) ? "thanks" : "answer"; });
    const sig = x => x.key + (x.correct||"");
    const changed = list.length!==items.length || list.some((x,i)=>!items[i]||sig(items[i])!==sig(x));
    items = list;
    const nc = Number(st0.current)||0, np = st0.phase === "thanks" ? "thanks" : "find", na = Number(st0.at)||0;
    if(!pending && (nc !== current || np !== phase || na !== phaseAt)){ current = nc; phase = np; phaseAt = na; render(); }
    else if(changed || teamsChanged) render();
  }catch(e){
    st.textContent = "連線失敗，自動重試中…";
  }
}

/* ---- 主持人換題 ---- */
function hostMsg(t){ const m=$("hostmsg"); m.textContent=t||""; m.hidden=!t; }
async function setStep(st){
  st = Math.max(0, Math.min(MAXSTEP, st));
  const target = stateOf(st);
  if(target.current === current && target.phase === phase) return;
  const before = {current, phase, phaseAt};
  current = target.current; phase = target.phase; phaseAt = Date.now() + clockOffset; render(); hostMsg("");
  if(!URL_){ store.set("thanks-state",{current, phase, at:phaseAt}); return; }
  const key = store.get("thanks-hostkey","");
  const undo = ()=>{ current = before.current; phase = before.phase; phaseAt = before.phaseAt; render(); };
  if(!key){ undo(); $("keybox").hidden = false; $("hostkey").focus(); hostMsg("先輸入主持密碼（Code.gs 裡的 HOST_KEY）。"); return; }
  pending = true;
  try{
    const r = await fetch(URL_,{method:"POST",body:JSON.stringify({action:"setState",current:target.current,phase:target.phase,key})});
    const j = await r.json();
    if(!j.ok){
      undo();
      if(j.error === "wrong key"){ store.set("thanks-hostkey",""); $("keybox").hidden = false; hostMsg("主持密碼不對，請重新輸入。"); }
      else hostMsg("換題失敗，請再按一次。");
    } else if(j.at){ phaseAt = j.at; render(); }
  }catch(e){ undo(); hostMsg("網路不穩，換題失敗，請再按一次。"); }
  pending = false;
}
function goNext(){
  if(current >= BOARD){ if(reveal < 3){ reveal++; render(); } return; }
  if(stepOf(current,phase) + 1 === MAXSTEP) reveal = 0;
  setStep(stepOf(current,phase)+1);
}
function goPrev(){
  if(current >= BOARD && reveal > 0){ reveal--; render(); return; }
  setStep(stepOf(current,phase)-1);
}
$("prev").addEventListener("click",goPrev);
$("next").addEventListener("click",goNext);
$("savekey").addEventListener("click",()=>{ const k=$("hostkey").value.trim(); if(!k) return; store.set("thanks-hostkey",k); $("hostkey").value=""; $("keybox").hidden=true; hostMsg(""); });
$("hostkey").addEventListener("keydown",e=>{ if(e.key==="Enter") $("savekey").click(); });
$("viewSel").addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  view = b.dataset.v;
  document.querySelectorAll("#viewSel button").forEach(x=>x.setAttribute("aria-pressed", x===b));
  render();
});
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea")) return;
  if(["ArrowRight","PageDown"].includes(e.key)){ e.preventDefault(); goNext(); }
  if(["ArrowLeft","PageUp"].includes(e.key)){ e.preventDefault(); goPrev(); }
});

render(); poll(); setInterval(poll, URL_?5000:1500);
})();
</script>
