<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>因為，需要感謝的人太多了</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: a sheet of green-ruled manuscript paper. Vertical title up top like the poster, then one card per street-view mission, stacked. */
:root{
  --paper:#F3F7F6; --card:#FFFFFF; --ink:#1D2220; --muted:#5B6166;
  --grid:#43AE74; --grid-soft:#D3EBDD; --wash:rgba(246,250,249,.80);
  --done:#2F8F5B; --warn:#B4442F;
  --f-serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-sans:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:16px/1.6 var(--f-sans);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:linear-gradient(var(--wash),var(--wash)),url(paper.jpg) center/cover no-repeat,var(--paper)}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:28px 56px;display:flex;flex-direction:column;gap:22px}

/* hero */
.hero{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;min-height:21rem}
.meta{align-self:flex-end;font-family:var(--f-serif);font-weight:500;font-size:1rem;--vt-gap:.5em}
h1{margin:0;font-family:var(--f-serif);font-weight:700;font-size:clamp(2rem,9vw,2.7rem);--vt-gap:.3em}

/* hand-stacked vertical text: one character per line, columns right to left */
.vt{display:flex;flex-direction:row-reverse;gap:var(--vt-gap,.35em);writing-mode:horizontal-tb}
.vt .col{display:flex;flex-direction:column;align-items:center;line-height:1.18}
.vt .col span{display:block;width:1em;text-align:center}
.vt .col span.p{height:.55em;line-height:.3;transform:translateX(.38em)}
.how{background:var(--card);border:1.5px solid var(--grid);padding:14px 16px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.how div{display:flex;flex-direction:column;gap:2px;font-size:.88rem;line-height:1.45}
.how b{font-family:var(--f-serif);font-size:1.05rem;color:var(--grid)}

/* inputs */
label.field{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:.95rem}
label.field small{font-weight:400;color:var(--muted);font-size:.8rem}
input[type=text],textarea{width:100%;font:1rem var(--f-sans);color:var(--ink);background:var(--card);border:1.5px solid var(--grid-soft);border-radius:0;padding:11px 12px}
textarea{resize:vertical;min-height:72px}
input[type=text]:focus,textarea:focus{outline:none;border-color:var(--grid);box-shadow:0 0 0 3px var(--grid-soft)}
button:focus-visible,a:focus-visible,.upload:focus-within{outline:3px solid var(--grid);outline-offset:2px}

/* mission card */
.mission{background:var(--card);border:1.5px solid var(--grid);display:grid;grid-template-columns:3.4rem 1fr;min-width:0}
.mission .no{border-right:1.5px solid var(--grid);display:flex;flex-direction:column;align-items:center;padding-top:12px;gap:2px;
  background:repeating-linear-gradient(to bottom,transparent 0 3.2rem,var(--grid-soft) 3.2rem calc(3.2rem + 1px))}
.mission .no b{font-family:var(--f-serif);font-weight:900;font-size:1.4rem;color:var(--grid);display:flex;flex-direction:column;align-items:center;line-height:1.2}
.mission .body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;min-width:0}
#missions{display:flex;flex-direction:column;gap:18px}
.mhead{appearance:none;border:0;background:none;padding:0;margin:0;text-align:left;color:inherit;font:inherit;cursor:pointer;
  display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;width:100%}
.mhead .h2{flex:1;min-width:0}
.fold{width:.6em;height:.6em;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);flex:none;align-self:center;transition:transform .2s}
.mission.collapsed .fold{transform:rotate(-45deg)}
.mission.collapsed .body > :not(.mhead){display:none}
.mission.collapsed .body{padding-bottom:14px}
.mission.past{opacity:.92}
.mission.past .no{background:var(--grid-soft)}
.mission.live{box-shadow:0 0 0 3px var(--grid-soft)}
.chip.live{background:var(--ink);border-color:var(--ink);color:#fff}
.wait{background:var(--card);border:1.5px dashed var(--grid);padding:18px 16px;display:flex;align-items:center;gap:12px}
.wait p{margin:0;font-family:var(--f-serif);font-size:1.1rem;font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;background:var(--grid);flex:none;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
.mhead .h2{margin:0;font-family:var(--f-serif);font-size:1.25rem;font-weight:700}
.chip{font-size:.75rem;padding:2px 10px;border:1px solid var(--grid-soft);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--done);border-color:var(--done);color:#fff}
.q{margin:0;font-size:1.05rem}
.tip{margin:-4px 0 0;font-size:.85rem;color:var(--muted)}
.btn{appearance:none;border:0;cursor:pointer;font:700 1rem var(--f-sans);padding:12px 16px;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn svg{width:20px;height:20px;flex:none}
.btn.map{background:var(--ink);color:#fff}
.btn.send{background:var(--grid);color:#fff;width:100%}
.btn.send:disabled{opacity:.6;cursor:wait}
.upload{display:flex;align-items:center;gap:12px;border:1.5px dashed var(--grid);padding:10px 12px;cursor:pointer;font-weight:700;font-size:.95rem;min-height:56px}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
.upload .need{font-weight:400;font-size:.8rem;color:var(--muted)}
.upload.has{border-style:solid}
.thumb{width:72px;height:72px;object-fit:cover;flex:none;border:1px solid var(--grid-soft)}
.uptext{display:flex;flex-direction:column;min-width:0}
.rm{margin-left:auto;appearance:none;border:0;background:none;color:var(--muted);font:500 .85rem var(--f-sans);text-decoration:underline;cursor:pointer;padding:6px}
.thx{border-top:1.5px dashed var(--grid);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.thx-lead{margin:0;font-family:var(--f-serif);font-size:1.05rem;font-weight:700;color:var(--grid)}
.thx-label{display:block}
.thx-to{display:block;font-family:var(--f-serif);font-size:1.15rem;font-weight:700;color:var(--ink);margin-top:2px}
.thx-ta{background:#FBFDFC}
.part{display:flex;flex-direction:column;gap:12px}
.locked{margin:0;font-size:.88rem;color:var(--muted);background:var(--paper);padding:8px 10px}
.timer{display:flex;align-items:center;gap:8px;font-family:var(--f-serif);font-weight:700;font-size:1rem;color:var(--ink)}
.timer b{font-size:1.5rem;color:var(--grid);font-variant-numeric:tabular-nums}
.timer.over b{color:var(--warn)}
.thx.soon{border-top-style:dotted}
.thx.soon .soon-text{margin:0;font-size:.88rem;color:var(--muted)}
.btn.send.thx-send{background:var(--ink)}
.team{background:var(--card);border:1.5px solid var(--grid);padding:16px}
.tsetup,.tform{display:flex;flex-direction:column;gap:12px}
.tlead{margin:0;font-family:var(--f-serif);font-weight:700;font-size:1.05rem}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1.5px solid var(--grid)}
.seg button{appearance:none;border:0;background:var(--card);color:var(--ink);font:700 1rem var(--f-sans);padding:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--grid);color:#fff}
#jCode{font-size:1.4rem;letter-spacing:.4em;font-variant-numeric:tabular-nums}
.tcard{display:flex;flex-direction:column;gap:8px}
.tc-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.tc-name{font-family:var(--f-serif);font-weight:900;font-size:1.4rem}
.tc-role{font-size:.8rem;color:#fff;background:var(--ink);padding:2px 10px;white-space:nowrap}
.tc-code{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;font-size:.9rem}
.tc-code b{font-family:var(--f-serif);font-size:2rem;color:var(--grid);letter-spacing:.2em;font-variant-numeric:tabular-nums}
.tc-code small{color:var(--muted);font-size:.8rem}
.tc-mem{margin:0;font-size:.9rem;color:var(--muted)}
.linkbtn{align-self:flex-start;appearance:none;border:0;background:none;color:var(--muted);font:500 .85rem var(--f-sans);text-decoration:underline;cursor:pointer;padding:4px 0}
.teamdone{margin:0;background:#F2FAF5;border-left:3px solid var(--grid);padding:10px 12px;font-size:.95rem}
.find.tdone > :not(.teamdone):not(.again){display:none}
.find .again{display:none}
.find.tdone.can-again .again{display:inline-block}
.msg{margin:0;font-size:.88rem}
.msg.err{color:var(--warn)}
.msg.ok{color:var(--done)}
.demo{background:#FFF7E0;border:1px solid #E9D497;padding:10px 12px;font-size:.85rem}
footer{text-align:center;font-size:.8rem;color:var(--muted);font-family:var(--f-serif);letter-spacing:.1em}
@media (max-width:380px){.how{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.dot{animation:none;opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="meta" data-vt="聯合聚會|嘉南中學|壹壹壹貳|貳零貳陸"></div>
    <h1 data-vt="因為，|需要感謝的人太多了"></h1>
  </header>

  <section class="how" aria-label="怎麼玩">
    <div><b>一　開街景</b>按每一題的「打開街景」，在 Google 地圖裡走到題目的地方。</div>
    <div><b>二　搶答</b>寫下答案、附上街景截圖送出。同隊誰都可以送，以最後一次為準；對錯搶答結束後公布。</div>
    <div><b>三　說謝謝</b>隊伍送出答案後，每個人都可以寫一句謝謝；搶答結束後再給大家一分鐘。</div>
  </section>

  <p class="demo" id="demo" hidden>試玩模式：還沒接上收件的試算表，送出的內容只會存在這支手機。</p>

  <section class="team" id="teamBox" aria-label="隊伍">
    <div id="teamSetup" class="tsetup">
      <p class="tlead">先組隊：一位當組長建立隊伍，其他人用隊伍代碼加入。</p>
      <div class="seg" role="group" aria-label="選擇身分">
        <button type="button" id="roleLeader" aria-pressed="true">我是組長</button>
        <button type="button" id="roleMember" aria-pressed="false">我是組員</button>
      </div>
      <div id="leaderForm" class="tform">
        <label class="field" for="tName">隊名<input id="tName" type="text" maxlength="12" placeholder="例：南一中迷路隊"></label>
        <label class="field" for="lName">你的名字<input id="lName" type="text" maxlength="12" placeholder="例：阿布" autocomplete="nickname"></label>
        <button type="button" class="btn send" id="createBtn">建立隊伍</button>
      </div>
      <div id="memberForm" class="tform" hidden>
        <label class="field" for="jCode">隊伍代碼<input id="jCode" type="text" inputmode="numeric" maxlength="4" placeholder="問組長，4 位數字"></label>
        <label class="field" for="mName">你的名字<input id="mName" type="text" maxlength="12" placeholder="例：小美" autocomplete="nickname"></label>
        <button type="button" class="btn send" id="joinBtn">加入隊伍</button>
      </div>
      <p class="msg" id="teamMsg" role="status" aria-live="polite"></p>
    </div>
    <div id="teamCard" class="tcard" hidden>
      <div class="tc-top"><span class="tc-name" id="tcName"></span><span class="tc-role" id="tcRole"></span></div>
      <div class="tc-code">隊伍代碼<b id="tcCode"></b><small>組員輸入這組數字加入</small></div>
      <p class="tc-mem" id="tcMem"></p>
      <button type="button" class="linkbtn" id="leaveBtn">不是這隊？換隊伍</button>
    </div>
  </section>

  <div id="missions">
    <div class="wait" id="wait" role="status" aria-live="polite">
      <span class="dot" aria-hidden="true"></span>
      <p id="waitText">等主持人開始第壹題</p>
    </div>
  </div>

  <footer>嘉南中學聯合聚會　2026.11.12</footer>
</div>

<template id="tpl">
  <article class="mission">
    <div class="no"><b></b></div>
    <div class="body">
      <button type="button" class="mhead" aria-expanded="true"><span class="h2" role="heading" aria-level="2"></span><span class="chip">還沒送出</span><span class="fold" aria-hidden="true"></span></button>
      <p class="q"></p>
      <div class="part find">
        <p class="tip"></p>
        <a class="btn map" target="_blank" rel="noopener">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>
          <span>打開街景</span>
        </a>
        <label class="field ans">你的答案
          <textarea maxlength="120" rows="2"></textarea>
        </label>
        <label class="upload">
          <input type="file" accept="image/*">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/></svg>
          <span class="uptext"><span class="uplabel">附上街景截圖</span><span class="need"></span></span>
        </label>
        <button class="btn send ans-send" type="button">搶答送出</button>
        <p class="teamdone" hidden></p>
        <button type="button" class="linkbtn again">改答案，重新送出</button>
        <p class="msg ans-msg" role="status" aria-live="polite"></p>
      </div>
      <p class="locked" hidden>搶答時間結束了。</p>
      <div class="thx">
        <p class="thx-lead"></p>
        <p class="soon-text" hidden>你們隊送出答案後，這裡就會打開，每個人都可以寫一句謝謝。</p>
        <div class="thx-open">
          <div class="timer" hidden><span>寫謝謝時間</span><b class="tleft">1:00</b></div>
          <label class="field thx-field"><span class="thx-label">寫一句謝謝給<b class="thx-to"></b></span>
            <textarea class="thx-ta" maxlength="80" rows="3" placeholder="例：謝謝你每天早上準時出現。"></textarea>
          </label>
          <button class="btn send thx-send" type="button">送出感謝</button>
          <p class="msg thx-msg" role="status" aria-live="polite"></p>
        </div>
      </div>
    </div>
  </article>
</template>

<script>
/* 直排文字：data-vt 用「|」分欄，每個字一行 */
document.querySelectorAll("[data-vt]").forEach(function(el){
  el.classList.add("vt");
  el.setAttribute("aria-label", el.getAttribute("data-vt").replace(/\|/g,""));
  el.getAttribute("data-vt").split("|").forEach(function(t){
    var col=document.createElement("span"); col.className="col"; col.setAttribute("aria-hidden","true");
    Array.from(t).forEach(function(ch){ var s=document.createElement("span"); s.textContent=ch; if("，、。".indexOf(ch)>-1) s.className="p"; col.appendChild(s); });
    el.appendChild(col);
  });
});
</script>
<script src="config.js"></script>
<script>
(function(){
const MS = Array.isArray(window.MISSIONS) ? window.MISSIONS : [];
const URL_ = (window.SCRIPT_URL || "").trim();
const THX_SEC = Number(window.THANKS_SECONDS) || 60;
const NUM = ["壹","貳","參","肆","伍","陸","柒","捌","玖","拾"];
/* 題號：試玩題顯示「試玩題」，其他照順序 第壹題、第貳題… */
const LABELS = (()=>{ let k=0; return MS.map(m=> m.practice ? "試玩題" : "第"+(NUM[k++]||k)+"題"); })();
const store = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
/* ---- 隊伍 ---- */
const $id = x => document.getElementById(x);
let me = store.get("thanks-team", null);   // {code, team, name, role, members}
if(me && (!me.code || !me.team)) me = null;  // 舊版後端留下的空隊伍
let teamDone = {};                           // 題號 → {by, correct}，隊上誰先送出
function showTeam(){
  $id("teamSetup").hidden = !!me; $id("teamCard").hidden = !me;
  if(!me) return;
  $id("tcName").textContent = me.team;
  $id("tcRole").textContent = (me.role==="leader"?"組長．":"組員．") + me.name;
  $id("tcCode").textContent = me.code;
  $id("tcMem").textContent = me.members && me.members.length ? "隊員：" + me.members.join("、") : "";
}
function setRole(r){
  $id("roleLeader").setAttribute("aria-pressed", r==="leader");
  $id("roleMember").setAttribute("aria-pressed", r==="member");
  $id("leaderForm").hidden = r!=="leader"; $id("memberForm").hidden = r!=="member";
  $id("teamMsg").textContent = "";
}
$id("roleLeader").addEventListener("click",()=>setRole("leader"));
$id("roleMember").addEventListener("click",()=>setRole("member"));
function teamErr(t){ const m=$id("teamMsg"); m.className="msg err"; m.textContent=t; }
async function teamCall(body){
  if(!URL_){
    const teams = store.get("thanks-teams",{});
    if(body.action==="createTeam"){
      let code; do{ code = String(1000+Math.floor(Math.random()*9000)); }while(teams[code]);
      teams[code] = {code, team:body.team, members:[body.name]}; store.set("thanks-teams",teams);
      return Object.assign({ok:true}, teams[code]);
    }
    const t = teams[body.code]; if(!t) return {ok:false, error:"no team"};
    if(!t.members.includes(body.name)) t.members.push(body.name); store.set("thanks-teams",teams);
    return Object.assign({ok:true}, t);
  }
  const r = await fetch(URL_,{method:"POST",body:JSON.stringify(body)}); return r.json();
}
$id("createBtn").addEventListener("click", async ()=>{
  const team = $id("tName").value.trim(), name = $id("lName").value.trim();
  if(!team) return teamErr("填一個隊名。"), $id("tName").focus();
  if(!name) return teamErr("填你的名字。"), $id("lName").focus();
  const b = $id("createBtn"); b.disabled = true; b.textContent = "建立中…";
  try{
    const j = await teamCall({action:"createTeam", team, name});
    if(j.ok && !j.code){ teamErr("後端還是舊版，沒有發隊伍代碼。請主持人把新的 Code.gs 部署成「新版本」。"); b.disabled = false; b.textContent = "建立隊伍"; return; }
    if(!j.ok) throw 0;
    me = {code:j.code, team:j.team, name, role:"leader", members:j.members}; store.set("thanks-team",me); resetDone(); teamDone = {}; showTeam(); refreshCards(false); poll();
  }catch(e){ teamErr("沒有建立成功，請確認網路後再按一次。"); }
  b.disabled = false; b.textContent = "建立隊伍";
});
$id("joinBtn").addEventListener("click", async ()=>{
  const code = $id("jCode").value.replace(/\D/g,""), name = $id("mName").value.trim();
  if(code.length !== 4) return teamErr("隊伍代碼是 4 位數字，問你的組長。"), $id("jCode").focus();
  if(!name) return teamErr("填你的名字。"), $id("mName").focus();
  const b = $id("joinBtn"); b.disabled = true; b.textContent = "加入中…";
  try{
    const j = await teamCall({action:"joinTeam", code, name});
    if(!j.ok || !j.team){ teamErr(j.error==="no team" ? "找不到這個代碼，再跟組長確認一次。" : (j.ok ? "後端還是舊版，請主持人把新的 Code.gs 部署成「新版本」。" : "沒有加入成功，請再按一次。")); }
    else { me = {code:j.code, team:j.team, name, role:"member", members:j.members}; store.set("thanks-team",me); resetDone(); teamDone = {}; showTeam(); refreshCards(false); poll(); }
  }catch(e){ teamErr("沒有加入成功，請確認網路後再按一次。"); }
  b.disabled = false; b.textContent = "加入隊伍";
});
$id("leaveBtn").addEventListener("click",()=>{ me = null; teamDone = {}; store.set("thanks-team",null); resetDone(); showTeam(); setRole("member"); if(current>=0) refreshCards(false); });
showTeam();
if(!URL_) document.getElementById("demo").hidden = false;
/* 每支手機自己記得送過哪些題（依隊伍分開記，換隊伍就重來） */
const doneKey = k => "thanks2-" + k + "-" + ((store.get("thanks-team",null)||{}).code||"none");
let doneA = store.get(doneKey("doneA"),{}), doneT = store.get(doneKey("doneT"),{});
function resetDone(){ doneA = store.get(doneKey("doneA"),{}); doneT = store.get(doneKey("doneT"),{}); }

function uid(){ return (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36)+Math.random().toString(36).slice(2)); }
function compress(file){
  return new Promise((res,rej)=>{
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = ()=>{
      const max = 1100, k = Math.min(1, max/Math.max(img.width,img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg",.78));
    };
    img.onerror = ()=>{ URL.revokeObjectURL(url); rej(new Error("bad image")); };
    img.src = url;
  });
}
async function send(payload){
  if(!URL_){
    const list = store.get("thanks-demo",[]);
    list.push(Object.assign({n:list.length+1,ts:Date.now()},payload));
    store.set("thanks-demo",list); return {ok:true, correct:""};
  }
  /* 人多的時候偶爾會塞車，失敗就自動再試一次 */
  let lastErr;
  for(let tryNo = 0; tryNo < 2; tryNo++){
    try{
      const r = await fetch(URL_,{method:"POST",body:JSON.stringify(payload)});
      const j = await r.json();
      if(j.ok) return j;
      lastErr = new Error(j.error || "server");
    }catch(e){ lastErr = e; }
    if(tryNo === 0) await new Promise(res=>setTimeout(res, 1200 + Math.random()*800));
  }
  throw lastErr;
}

const box = document.getElementById("missions"), tpl = document.getElementById("tpl");
const cards = [], allowAgain = {};
MS.forEach((m,i)=>{
  const el = tpl.content.firstElementChild.cloneNode(true);
  const $ = q => el.querySelector(q);
  { const b=$(".no b"); b.setAttribute("aria-label",LABELS[i]); Array.from(LABELS[i]).forEach(ch=>{const sp=document.createElement("span");sp.textContent=ch;sp.setAttribute("aria-hidden","true");b.appendChild(sp);}); }
  $(".h2").textContent = m.title || ("第 "+(i+1)+" 題");
  $(".q").textContent = m.question || "";
  if(m.hint) $(".tip").textContent = m.hint; else $(".tip").hidden = true;
  $(".map").href = m.map || "https://www.google.com/maps";
  const photo = m.photo || "optional";
  const askAnswer = m.askAnswer !== false;
  const ta = $(".ans textarea"); ta.id = "ans"+i; $(".ans").htmlFor = ta.id;
  if(!askAnswer) $(".ans").hidden = true;

  const up = $(".upload"), file = $(".upload input"); file.id = "img"+i;
  if(photo==="none") up.hidden = true;
  $(".need").textContent = photo==="required" ? "一定要附截圖，證明你們真的找到了" : "可以不附";
  const tta = $(".thx-ta"); tta.id = "thx"+i; $(".thx-field").htmlFor = tta.id;
  $(".thx-to").textContent = m.thanksTo || "一個你想謝謝的人";
  $(".thx-lead").textContent = m.thanksLead || "這讓你想到誰？";
  const chip = $(".chip");
  let image = null;

  file.addEventListener("change", async ()=>{
    const f = file.files[0]; if(!f) return;
    const msg = $(".ans-msg"); msg.className = "msg ans-msg"; msg.textContent = "照片處理中…";
    try{
      image = await compress(f);
      up.classList.add("has");
      let t = up.querySelector(".thumb");
      if(!t){ t = document.createElement("img"); t.className = "thumb"; t.alt = "你選的截圖"; up.insertBefore(t, up.querySelector(".uptext")); up.querySelector("svg").hidden = true;
        const rm = document.createElement("button"); rm.type="button"; rm.className="rm"; rm.textContent="移除";
        rm.addEventListener("click",e=>{ e.preventDefault(); image=null; t.remove(); rm.remove(); up.classList.remove("has"); up.querySelector("svg").hidden=false; up.querySelector(".uplabel").textContent="附上街景截圖"; file.value=""; });
        up.appendChild(rm); }
      t.src = image; up.querySelector(".uplabel").textContent = "已選好截圖"; msg.textContent = "";
    }catch(e){ msg.className = "msg ans-msg err"; msg.textContent = "這張圖讀不進來，請換一張截圖（JPG 或 PNG）。"; }
  });

  function needName(msg){
    if(!me){ msg.className = msg.className.replace(/ (err|ok)/g,"")+" err"; msg.textContent = "先在最上面建立或加入隊伍。"; $id("teamBox").scrollIntoView({behavior:"smooth",block:"start"}); return ""; }
    return me.name;
  }
  function setChip(){
    const n = i+1;
    chip.classList.remove("ok","live");
    if(n === current && phase === "find"){ chip.textContent = doneA[i] ? "已搶答 ✓" : "搶答中"; chip.classList.add(doneA[i]?"ok":"live"); }
    else if(n === current){ chip.textContent = doneT[i] ? "已送出感謝 ✓" : "寫謝謝中"; chip.classList.add(doneT[i]?"ok":"live"); }
    else { chip.textContent = doneT[i] ? "已送出感謝 ✓" : "點開補寫謝謝"; if(doneT[i]) chip.classList.add("ok"); }
  }

  $(".ans-send").addEventListener("click", async ()=>{
    const btn = $(".ans-send"), msg = $(".ans-msg");
    const name = needName(msg); if(!name) return;
    const answer = askAnswer ? ta.value.trim() : "";
    msg.className = "msg ans-msg err";
    if(photo==="required" && !image){ msg.textContent = "這題要附上街景截圖。"; return; }
    if(askAnswer && !answer){ msg.textContent = "寫下你們找到的答案再送出。"; ta.focus(); return; }
    if(photo !== "none" && photo !== "required" && !answer && !image){ msg.textContent = "寫下答案或附上截圖再送出。"; ta.focus(); return; }
    btn.disabled = true; btn.textContent = "送出中…"; msg.className = "msg ans-msg"; msg.textContent = "";
    try{
      await send({type:"answer", id:uid(), name, team:me.team, code:me.code, mission:i+1, mid:m.id||"", title:LABELS[i] + "．" + (m.title||""), answer, image});
      /* 對錯先不說，搶答結束後才公布；每隊以最後一次送出的答案為準 */
      doneA[i] = true; store.set(doneKey("doneA"),doneA);
      teamDone[i+1] = {by:name, correct:"?"};
      allowAgain[i] = false;
      setChip();
      msg.className = "msg ans-msg ok";
      msg.textContent = "送出了！對錯會在搶答結束後公布。";
      btn.textContent = "搶答送出";
      refreshCards(false);
      openThx();
    }catch(e){ msg.className = "msg ans-msg err"; msg.textContent = "沒有送出去，請確認網路後再按一次。"; btn.textContent = "搶答送出"; }
    btn.disabled = false;
  });

  $(".thx-send").addEventListener("click", async ()=>{
    const btn = $(".thx-send"), msg = $(".thx-msg");
    const name = needName(msg); if(!name) return;
    const thanks = tta.value.trim();
    if(!thanks){ msg.className = "msg thx-msg err"; msg.textContent = "寫一句謝謝再送出。"; tta.focus(); return; }
    btn.disabled = true; btn.textContent = "送出中…"; msg.className = "msg thx-msg"; msg.textContent = "";
    try{
      await send({type:"thanks", id:uid(), name, team:me.team, code:me.code, mission:i+1, title:LABELS[i] + "．" + (m.title||""), thanks, thanksTo:m.thanksTo||""});
      doneT[i] = true; store.set(doneKey("doneT"),doneT); setChip();
      tta.value = "";   // 清空，想再謝謝別人可以直接寫下一句
      msg.className = "msg thx-msg ok"; msg.textContent = "已送上大螢幕：「" + thanks + "」想再謝謝別人，可以直接寫下一句。";
      btn.textContent = "再送一句";
    }catch(e){ msg.className = "msg thx-msg err"; msg.textContent = "沒有送出去，請確認網路後再按一次。"; btn.textContent = "送出感謝"; }
    btn.disabled = false;
  });

  function openThx(){ $(".thx-open").hidden = false; $(".soon-text").hidden = true; $(".thx").classList.remove("soon"); }
  $(".again").addEventListener("click",()=>{ $(".find").classList.remove("tdone"); allowAgain[i] = true; });
  const head = $(".mhead");
  head.addEventListener("click",()=>{ const c = !el.classList.contains("collapsed"); el.classList.toggle("collapsed",c); head.setAttribute("aria-expanded",!c); });
  el.hidden = true;
  cards.push({el, head, setChip, $});
  box.appendChild(el);
});

/* ---- 主持人控制：目前題號 current、階段 phase（find 搶答 / thanks 寫謝謝） ---- */
let current = -1, phase = "find", phaseAt = 0, clockOffset = 0;
function applyState(cur, ph, at){
  cur = Math.max(0, Math.min(MS.length + 1, Number(cur)||0));   // MS.length+1 = 排行榜
  ph = ph === "thanks" ? "thanks" : "find";
  if(cur === current && ph === phase && at === phaseAt) return;
  const first = current === -1, moved = cur !== current || ph !== phase;
  current = cur; phase = ph; phaseAt = Number(at)||0;
  refreshCards(moved);
  const wait = document.getElementById("wait"), wt = document.getElementById("waitText");
  wait.style.order = 1;
  if(cur === 0){ wait.hidden = false; wait.style.order = 0; wt.textContent = "等主持人開始" + (LABELS[0]||"第壹題"); }
  else if(cur > MS.length){ wait.hidden = false; wait.style.order = 0; wt.textContent = "排行榜公布中，抬頭看大螢幕！"; }
  else if(cur < MS.length || ph === "find"){ wait.hidden = false; wt.textContent = ph === "find" ? "主持人結束搶答後，會再給大家一分鐘寫謝謝" : "下一題準備中，主持人開放後會自動出現"; }
  else wait.hidden = true;
  if(!first && moved && cur > 0){
    const c = cards[cur-1];
    const target = ph === "thanks" ? c.$(".thx") : c.el;
    target.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth", block:"start"});
  }
  tick();
}
function refreshCards(moved){
  if(current < 0) return;
  const cur = current, ph = phase;
  cards.forEach((c,i)=>{
    const n = i+1, live = n === cur, past = n < cur;
    const td = teamDone[n], m = MS[i];
    const teamOK = !!td;   // 隊上有人送出過答案（不管對錯）
    c.el.hidden = n > cur;
    c.el.classList.toggle("live", live);
    c.el.classList.toggle("past", past);
    c.el.style.order = live ? 0 : (cur - n) + 1;
    const findOpen = live && ph === "find";
    const f = c.$(".find");
    f.hidden = !findOpen;
    f.classList.toggle("tdone", teamOK && !allowAgain[i]);
    f.classList.toggle("can-again", teamOK);
    if(teamOK){ c.$(".teamdone").hidden = false; c.$(".teamdone").textContent = "你們隊已送出答案（" + (td.by === (me&&me.name) ? "你" : td.by) + " 送的），對錯搶答結束後公布。可以開始寫謝謝了；想改答案就按下面重送，以最後一次為準。"; }
    else c.$(".teamdone").hidden = true;
    c.$(".locked").hidden = findOpen;
    c.$(".locked").textContent = !teamOK ? "搶答時間結束了。"
      : td.correct === "O" ? "搶答時間結束了，你們答「隊」了！✓"
      : td.correct === "X" ? "搶答時間結束了，這題沒答對，下一題加油！"
      : "搶答時間結束了，你們隊有送出答案 ✓";
    const thxOpen = !(live && ph === "find") || teamOK || !!doneA[i];
    c.$(".thx-open").hidden = !thxOpen;
    c.$(".soon-text").hidden = thxOpen;
    c.$(".thx").classList.toggle("soon", !thxOpen);
    c.$(".timer").hidden = !(live && ph === "thanks");
    if(moved){
      c.el.classList.toggle("collapsed", past);
      c.head.setAttribute("aria-expanded", !past);
    }
    if(teamOK && !doneA[i]) doneA[i] = true;
    c.setChip();
  });
}
/* 計分題答對後就不再送；不計分題可以讓隊員各送一份 */

function applyDone(done){
  const next = {};
  Object.keys(done||{}).forEach(k=>next[Number(k)] = done[k]);
  Object.keys(teamDone).forEach(k=>{ if(!next[k]) next[k] = teamDone[k]; });
  const changed = JSON.stringify(next) !== JSON.stringify(teamDone);
  teamDone = next;
  if(changed && current >= 0) refreshCards(false);
}
function tick(){
  if(current < 1 || phase !== "thanks") return;
  const c = cards[current-1]; if(!c) return;
  const left = Math.max(0, Math.round(THX_SEC - (Date.now() + clockOffset - phaseAt)/1000));
  const t = c.$(".timer");
  t.classList.toggle("over", left === 0);
  c.$(".tleft").textContent = left > 0 ? Math.floor(left/60) + ":" + String(left%60).padStart(2,"0") : "時間到，還可以送";
}
setInterval(tick, 1000);
async function poll(){
  try{
    if(!URL_){
      const st = store.get("thanks-state",{current:0,phase:"find",at:0});
      if(me){ const d = {}; store.get("thanks-demo",[]).forEach(x=>{ if(x.code===me.code && x.type==="answer" && !d[x.mission]) d[x.mission]={by:x.name,correct:""}; }); applyDone(d);
        const t = store.get("thanks-teams",{})[me.code]; if(t){ me.members = t.members; showTeam(); } }
      applyState(st.current, st.phase, st.at); return;
    }
    const r = await fetch(URL_ + "?state=1" + (me ? "&team=" + encodeURIComponent(me.code) : "") + "&t=" + Date.now());
    const j = await r.json();
    if(j.ok){
      if(j.now) clockOffset = j.now - Date.now();
      if(me && j.noTeam){ me = null; teamDone = {}; store.set("thanks-team",null); resetDone(); showTeam(); setRole("leader"); teamErr("活動重新開始了，請重新組隊。"); }
      if(me && j.done) applyDone(j.done);
      if(me && Array.isArray(j.members)){ me.members = j.members; store.set("thanks-team",me); showTeam(); }
      applyState(j.current, j.phase, j.at);
    }
  }catch(e){}
}
poll();
setInterval(poll, URL_ ? 6000 : 1500);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden) poll(); });
})();
</script>
